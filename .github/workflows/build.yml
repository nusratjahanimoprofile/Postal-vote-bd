name: Build Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট করা
      - uses: actions/checkout@v3

      # ২. Node.js সেটআপ
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ৩. JDK সেটআপ
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # ৪. ওয়েব বিল্ড তৈরি
      - name: Install Dependencies and Build Web
        run: |
          npm install
          npm run build

      # ৫. Android ফোল্ডার রিসেট করা (পুরানো ফোল্ডার মুছে নতুন করে তৈরি)
      # এটি 'already exists' এবং 'missing gradlew' দুটি সমস্যারই সমাধান করবে
      - name: Setup Fresh Android Platform
        run: |
          npm install @capacitor/android
          rm -rf android
          npx cap add android

      # ৬. আপনার কাস্টম পারমিশন ও ফাইল ফিক্স (Native Fixes)
      - name: Copy Back Permissions
        run: |
          cp native-fixes/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/postalvote/app/
          cp native-fixes/MainActivity.java android/app/src/main/java/com/postalvote/app/MainActivity.java
          echo "✅ Native files restored!"

      # ৭. Capacitor সিঙ্ক করা (ওয়েব বিল্ড অ্যান্ড্রয়েডে পাঠানো)
      - name: Sync Capacitor
        run: npx cap sync android

      # ৮. Android APK বিল্ড করা
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ৯. APK আপলোড করা
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
