name: Build Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট করা
      - uses: actions/checkout@v3

      # ২. Node.js সেটআপ (React/Web অংশের জন্য)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ৩. ডিপেন্ডেন্সি ইন্সটল এবং ওয়েব বিল্ড
      - name: Install Dependencies and Build Web
        run: |
          npm install
          npm run build

      # ৪. JDK সেটআপ (Android এর জন্য)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # ৫. আপনার কাস্টম পারমিশন ও ফাইল ফিক্স (Native Fixes)
      - name: Copy Back Permissions
        run: |
          # ১. AndroidManifest কপি করা
          cp native-fixes/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # ২. MainActivity কপি করার জন্য সঠিক ফোল্ডার তৈরি
          mkdir -p android/app/src/main/java/com/postalvote/app/
          cp native-fixes/MainActivity.java android/app/src/main/java/com/postalvote/app/MainActivity.java
          
          echo "✅ Native files restored with correct package path!"

      # ৬. Capacitor সিঙ্ক করা (Web কোড Android এ পাঠানো)
      - name: Sync Capacitor
        run: npx cap sync android

      # ৭. Android APK বিল্ড করা
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ৮. APK আপলোড করা (যাতে আপনি ডাউনলোড করতে পারেন)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
