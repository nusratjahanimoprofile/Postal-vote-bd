<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Vote BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
        .bg-bd-green { background-color: #006a4e; }
        .text-bd-green { color: #006a4e; }
        .bg-bd-red { background-color: #f42a41; }
        @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 100% { transform: translateY(320px); opacity: 0; } }
        .animate-scan { animation: scan 2s linear infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- Capacitor Permission Script (Safe Mode) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // অ্যাপ লোড হওয়ার পর ২ সেকেন্ড অপেক্ষা করে পারমিশন চাইবে
            // এটি অ্যাপ ক্র্যাশ হওয়া থেকে বাঁচায়
            setTimeout(async () => {
                if (window.Capacitor) {
                    try {
                        const { Camera } = Capacitor.Plugins;
                        const { Geolocation } = Capacitor.Plugins;
                        
                        // ক্যামেরা এবং লোকেশন পারমিশন রিকোয়েস্ট
                        if (Camera) await Camera.requestPermissions();
                        if (Geolocation) await Geolocation.requestPermissions();
                        
                        console.log("Permissions requested safely on startup");
                    } catch (error) {
                        console.warn("Capacitor permission error:", error);
                    }
                }
            }, 2000); // ২০০০ মিলি সেকেন্ড = ২ সেকেন্ড ডিলে
        });
    </script>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
